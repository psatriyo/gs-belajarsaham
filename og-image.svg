<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0e3b6e"/>
      <stop offset="100%" stop-color="#155daa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffc857"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative chart line -->
  <polyline points="80,520 180,440 280,470 380,380 480,340 580,260 680,290 780,200 880,160 980,120" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
  <polyline points="80,520 180,440 280,470 380,380 480,340 580,260 680,290 780,200 880,160 980,120" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" stroke-dasharray="1200" stroke-dashoffset="0"/>
  <!-- Dot at peak -->
  <circle cx="980" cy="120" r="6" fill="#ffc857" opacity="0.5"/>
  <!-- Accent bar -->
  <rect x="80" y="200" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <!-- Badge -->
  <rect x="80" y="160" width="220" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="190" y="179" fill="rgba(255,255,255,0.7)" font-size="13" font-weight="600" text-anchor="middle">✦ Panduan Pemula — Gratis</text>
  <!-- Title -->
  <text x="80" y="280" fill="#ffffff" font-size="56" font-weight="900" letter-spacing="-1.5">Belajar Saham</text>
  <text x="80" y="350" fill="#ffffff" font-size="56" font-weight="900" letter-spacing="-1.5">dari Nol</text>
  <!-- Subtitle -->
  <text x="80" y="410" fill="rgba(255,255,255,0.7)" font-size="22" font-weight="400">Panduan lengkap investasi saham Indonesia untuk pemula</text>
  <!-- Bottom accent line -->
  <rect x="80" y="560" width="1040" height="1" fill="rgba(255,255,255,0.08)"/>
  <text x="80" y="590" fill="rgba(255,255,255,0.4)" font-size="14" font-weight="600">gs-belajarsaham.prayudisatriyo.com</text>
</svg>